[package]
name = "minecraft-launcher-srusm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "7.0.0"
lyceris = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.16.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
reqwest = { version = "0.12", features = ["json"] }
zip = "2"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
futures = "0.3"
hotpath = "0.28.2"
flate2 = "1"
tar = "0.4"
sysinfo = "0.32"
fastnbt = "2.5"
base64 = "0.22"
hickory-resolver = "0.24"
sha1 = "0.10"          # SHA-1 der Mod-Jars (Modrinth erkennt Dateien per Hash)
notify-rust = "4"      # Desktop-Benachrichtigungen

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"           # Tray-Icon (StatusNotifierItem), nur Linux

[build-dependencies]
slint-build = "1.16.1"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"] # Optional, um auch Speicherallokationen zu messen

#[profile.release]
#codegen-units = 1
#lto = true

[profile.release]
opt-level = 3
lto = "fat"          # oder "fat" für max Performance
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = false
