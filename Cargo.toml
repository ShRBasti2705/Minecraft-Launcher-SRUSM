[package]
name = "minecraft-launcher-srusm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "7.0.0"
lyceris = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.16.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
reqwest = { version = "0.12", features = ["json"] }
zip = "2"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
futures = "0.3"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true
